version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dfu_xai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dfu_user
      POSTGRES_PASSWORD: dfu_password
      POSTGRES_DB: dfu_xai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfu_user -d dfu_xai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dfu_xai_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://dfu_user:dfu_password@db:5432/dfu_xai
      - SECRET_KEY=change-this-insecure-docker-key-for-local-development-only
      - CORS_ORIGINS=["http://localhost:3000"]
      - UPLOAD_DIR=/app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dfu_xai_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
